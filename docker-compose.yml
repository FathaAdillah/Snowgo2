# Local development stack. `make up` / `make down` (volumes are kept).
name: ${COMPOSE_PROJECT_NAME:-snowego}

x-api-env: &api-env
  APP_NAME: Snowego
  API_CO_ID_KEY: ${API_CO_ID_KEY:-}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_KEY: ${APP_KEY:?run make setup}
  APP_URL: ${APP_URL}
  ADMIN_URL: ${ADMIN_URL}
  LOG_CHANNEL: stack
  LOG_STACK: stderr,daily
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  # DB-AUTH-003: device listing and revocation need the database session driver.
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-10080}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
  FILESYSTEM_DISK: private
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: http://minio:9000
  S3_USE_PATH_STYLE_ENDPOINT: "true"
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL}
  S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
  S3_DOWNLOAD_ENDPOINT: ${S3_DOWNLOAD_ENDPOINT:-http://127.0.0.1:${MINIO_API_PORT:-9000}}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

x-api: &api
  build:
    context: .
    dockerfile: infrastructure/docker/api/Dockerfile
    target: dev
  image: snowego/api:dev
  environment: *api-env
  volumes:
    - ./apps/api:/var/www/api
    # Named volume: Composer on a Windows/macOS bind mount is slow and can fail unzipping large packages.
    - api_vendor:/var/www/api/vendor
    - api_logs:/var/www/api/storage/logs
    - api_views:/var/www/api/storage/framework/views
  networks: [internal]

x-node-volumes: &node-volumes
  - .:/workspace
  - node_modules:/workspace/node_modules
  - admin_node_modules:/workspace/apps/admin/node_modules
  - storefront_node_modules:/workspace/apps/storefront/node_modules
  - api_types_node_modules:/workspace/packages/api-types/node_modules

x-nitro: &nitro
  environment:
    NUXT_API_INTERNAL_ORIGIN: http://api-nginx:8000
    NUXT_PUBLIC_SITE_URL: ${APP_URL}
  volumes: *node-volumes
  networks: [internal]
  depends_on:
    web-deps:
      condition: service_completed_successfully
    api-nginx:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
    interval: 10s
    timeout: 3s
    retries: 30
    start_period: 30s

services:
  web-deps:
    image: node:24-alpine3.22
    working_dir: /workspace
    volumes: *node-volumes
    command: ["sh", "infrastructure/scripts/web-deps.sh"]
    networks: [internal]

  edge:
    image: nginx:1.28-alpine
    ports:
      # Loopback only: dev ingress (incl. /db DB tools) is not reachable from the network.
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTP_PORT:-80}:80"
    environment:
      STOREFRONT_HOST: ${STOREFRONT_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      NGINX_ENVSUBST_FILTER: "^(STOREFRONT|ADMIN)_HOST$$"
    volumes:
      - ./infrastructure/nginx/edge.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infrastructure/nginx/edge-common.conf:/etc/nginx/snippets/edge-common.conf:ro
      - ./infrastructure/nginx/edge-dev-tools.conf:/etc/nginx/snippets/admin-dev/dbtools.conf:ro
      - ./infrastructure/nginx/admin-log-viewer.conf:/etc/nginx/snippets/admin-dev/log-viewer.conf:ro
    networks: [internal]
    depends_on:
      storefront:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q"]
      interval: 30s
      timeout: 3s
      retries: 3

  storefront:
    <<: *nitro
    build:
      context: .
      dockerfile: infrastructure/docker/storefront/Dockerfile
      target: dev
    image: snowego/storefront:dev

  admin:
    <<: *nitro
    build:
      context: .
      dockerfile: infrastructure/docker/admin/Dockerfile
      target: dev
    image: snowego/admin:dev

  api-nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./infrastructure/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/var/www/api/public:ro
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck-api"]
      interval: 10s
      timeout: 3s
      retries: 10

  horizon:
    <<: *api
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy

  migrate:
    <<: *api
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    environment:
      S3_ENDPOINT_INTERNAL: http://minio:9000
      S3_ROOT_USER: ${S3_ROOT_USER}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
    volumes:
      - ./infrastructure/scripts/minio-init.sh:/scripts/minio-init.sh:ro
    networks: [internal]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4.7
    environment:
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [internal]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  dbtools:
    # Development only: authenticated superadmin at the edge, then OmniDB's own login.
    image: omnidbteam/omnidb:3.0.3b
    entrypoint: ["sh", "/usr/local/bin/omnidb-entrypoint"]
    environment:
      DBTOOLS_USER: ${DBTOOLS_USER}
      DBTOOLS_PASSWORD: ${DBTOOLS_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./infrastructure/scripts/omnidb-entrypoint.sh:/usr/local/bin/omnidb-entrypoint:ro
      - omnidb:/home/omnidb/.omnidb
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/db/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  internal:

volumes:
  clamav_signatures:
  api_logs:
  api_views:
  api_vendor:
  postgres:
  omnidb:
  redis:
  minio:
  node_modules:
  admin_node_modules:
  storefront_node_modules:
  api_types_node_modules:
