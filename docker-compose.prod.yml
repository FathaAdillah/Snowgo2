# Production-shaped stack: immutable images, no bind mounts, no Mailpit, only the edge is published.
# Image tags come from CI digests (SNOWEGO_*_IMAGE). TLS terminates in front of `edge`.
name: snowego

x-api-env: &api-env
  APP_NAME: Snowego
  API_CO_ID_KEY: ${API_CO_ID_KEY:-}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?}
  APP_URL: ${APP_URL:?}
  ADMIN_URL: ${ADMIN_URL:?}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?}
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:?}
  DB_USERNAME: ${DB_USERNAME:?}
  DB_PASSWORD: ${DB_PASSWORD:?}
  REDIS_CLIENT: phpredis
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-10080}
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?}
  FILESYSTEM_DISK: private
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_USE_PATH_STYLE_ENDPOINT: ${S3_USE_PATH_STYLE_ENDPOINT:-true}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:?}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:?}
  S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:?}
  S3_DOWNLOAD_ENDPOINT: ${S3_DOWNLOAD_ENDPOINT:-${S3_ENDPOINT}}
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:?}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

x-api: &api
  image: ${SNOWEGO_API_IMAGE:?}
  environment: *api-env
  networks: [internal]
  restart: unless-stopped

x-nitro: &nitro
  environment:
    NUXT_API_INTERNAL_ORIGIN: http://api-nginx:8000
    NUXT_PUBLIC_SITE_URL: ${APP_URL}
  networks: [internal]
  restart: unless-stopped
  depends_on:
    api-nginx:
      condition: service_healthy

services:
  edge:
    image: nginx:1.28-alpine
    ports:
      # Loopback only: the TLS terminator/tunnel on the host is the sole public entry.
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTP_PORT:-80}:80"
    environment:
      STOREFRONT_HOST: ${STOREFRONT_HOST:?}
      ADMIN_HOST: ${ADMIN_HOST:?}
      NGINX_ENVSUBST_FILTER: "^(STOREFRONT|ADMIN)_HOST$$"
    volumes:
      - ./infrastructure/nginx/edge.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infrastructure/nginx/edge-common.conf:/etc/nginx/snippets/edge-common.conf:ro
    networks: [internal]
    restart: unless-stopped
    depends_on:
      storefront:
        condition: service_healthy
      admin:
        condition: service_healthy

  storefront:
    <<: *nitro
    image: ${SNOWEGO_STOREFRONT_IMAGE:?}

  admin:
    <<: *nitro
    image: ${SNOWEGO_ADMIN_IMAGE:?}

  api-nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./infrastructure/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - api_public:/var/www/api/public:ro
    networks: [internal]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *api
    # Publishes public/ for api-nginx before starting FPM.
    command: ["sh", "-c", "cp -R public/. /srv/public/ && exec php-fpm"]
    volumes:
      - api_public:/srv/public
    healthcheck:
      test: ["CMD", "healthcheck-api"]
      interval: 10s
      timeout: 3s
      retries: 10

  horizon:
    <<: *api
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 60s

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]

  migrate:
    <<: *api
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    profiles: [release]

  clamav:
    image: clamav/clamav:1.4.7
    environment:
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks: [internal]
    restart: unless-stopped

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  internal:

volumes:
  clamav_signatures:
  postgres:
  redis:
  api_public:
