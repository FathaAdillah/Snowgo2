# Only the admin vhost mounts this file. Authorize each OmniDB HTTP request.
location = /_db_access {
    internal;
    set $operator_api http://api-nginx:8000;
    proxy_pass $operator_api/internal/operator-db-access;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
}
location = /db {
    auth_request /_db_access;
    try_files /__omnidb_no_static_files__ @db_root;
}
location @db_root {
    absolute_redirect off;
    return 302 /db/;
}
location ^~ /db/ {
    auth_request /_db_access;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "omnidb_sessionid=$cookie_omnidb_sessionid; omnidb_csrftoken=$cookie_omnidb_csrftoken";
    proxy_cookie_path ~^/$ /db/;
    # No long-lived upgrades that could outlive the staff session.
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    set $dbtools_upstream http://dbtools:8000;
    proxy_pass $dbtools_upstream;
    proxy_read_timeout 300s;
}
