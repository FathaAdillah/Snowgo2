# Dev only: keep both the historic storefront link and the admin link.
location = /db {
    absolute_redirect off;
    return 302 /db/;
}
location ^~ /db/ {
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "omnidb_sessionid=$cookie_omnidb_sessionid; omnidb_csrftoken=$cookie_omnidb_csrftoken";
    proxy_cookie_path ~^/$ /db/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    set $dbtools_upstream http://dbtools:8000;
    proxy_pass $dbtools_upstream;
    proxy_read_timeout 300s;
}
