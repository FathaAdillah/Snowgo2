# Production admin host only. Laravel enforces independent opt-in flags and MFA.
# Inherit all proxy headers from edge-common.conf, including HTTPS origin scheme.
location ~ ^/(?:log-viewerx|horizon)(?:/|$) {
    set $operator_upstream http://api-nginx:8000;
    proxy_pass $operator_upstream;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Request-Id;
    add_header Cache-Control "private, no-store" always;
    add_header X-Request-Id $edge_request_id always;
}
