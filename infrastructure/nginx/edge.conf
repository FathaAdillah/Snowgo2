# Edge ingress: hostname routing to Nitro. Laravel is only reached through Nitro's same-origin proxy.
map $http_x_request_id $edge_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# WebSocket passthrough (Nuxt dev HMR); plain requests keep upstream keepalive semantics.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

log_format snowego '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time rid=$edge_request_id host=$host';

# Resolve service names per request so replaced containers (new IPs) are picked up without reload.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost ${STOREFRONT_HOST};
    location ^~ /api/v1/admin/ { return 404; }
    include /etc/nginx/snippets/edge-common.conf;
    set $nitro_upstream http://storefront:3000;
    location / { proxy_pass $nitro_upstream; }
}

server {
    listen 80;
    server_name admin.localhost ${ADMIN_HOST};
    include /etc/nginx/snippets/edge-common.conf;
    include /etc/nginx/snippets/admin-dev/*.conf;
    include /etc/nginx/snippets/admin-operator/*.conf;
    location ^~ /api/v1/auth/google/ { return 404; }
    set $nitro_upstream http://admin:3000;
    location / { proxy_pass $nitro_upstream; }
}
