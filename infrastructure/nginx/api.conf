# Private API upstream: Nginx -> PHP-FPM. Never published to the public network.
# $uri becomes /index.php after try_files. Preserve the original path, never OAuth query values.
map $request_uri $api_log_path {
    ~^(?<original_path>[^?]+) $original_path;
    default "-";
}
log_format api_safe '$remote_addr "$request_method $api_log_path" $status $body_bytes_sent rid=$request_id_out';
server {
    access_log /dev/stdout api_safe;
    listen 8000;
    server_name _;
    root /var/www/api/public;
    index index.php;

    client_max_body_size 25m;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream api:9000;


    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $request_id_out;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

map $http_x_request_id $request_id_out {
    default $http_x_request_id;
    ""      $request_id;
}
