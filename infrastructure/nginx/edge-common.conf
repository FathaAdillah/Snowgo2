access_log /dev/stdout snowego;
server_tokens off;
client_max_body_size 12m;

# Internal probes and consoles never leave the private network.
location ^~ /api/v1/internal/ { return 404; }

proxy_hide_header X-Request-Id;
add_header X-Request-Id $edge_request_id always;

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Request-Id $edge_request_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 60s;
