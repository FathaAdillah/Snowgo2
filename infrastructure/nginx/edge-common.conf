access_log /dev/stdout snowego;
server_tokens off;
client_max_body_size 25m;
error_page 413 = @upload_too_large;

location @upload_too_large {
    default_type application/json;
    add_header X-Request-Id $request_id always;
    return 413 '{"success":false,"code":"UPLOAD_REJECTED","message":"Multipart body too large","meta":{"request_id":"$request_id"}}';
}

# Internal probes and consoles never leave the private network.
location ^~ /api/v1/internal/ { return 404; }

proxy_hide_header X-Request-Id;
add_header X-Request-Id $edge_request_id always;

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Request-Id $edge_request_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 60s;
