
name: Publish Production Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: snowego-production-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - api
          - admin
          - storefront

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.app }}/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/fathaadillah/snowgo2/${{ matrix.app }}:master
            ghcr.io/fathaadillah/snowgo2/${{ matrix.app }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/FathaAdillah/Snowgo2
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Print image digest
        run: |
          echo "ghcr.io/fathaadillah/snowgo2/${{ matrix.app }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
