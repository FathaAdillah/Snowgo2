name: Foundation CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare disposable Compose environment
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          docker compose build api storefront
          docker compose run --rm --no-deps api composer install --no-interaction --prefer-dist
          docker compose run --rm web-deps
      - name: Migrate the disposable database and check contract drift
        run: make migrate contracts-check
      - name: Audit locked dependencies
        run: |
          docker compose run --rm --no-deps api composer audit --locked
          docker compose run --rm --no-deps storefront npm audit --audit-level=high
      - name: Pint, Larastan, ESLint and Nuxt typechecks
        run: make lint test-web
      - name: PostgreSQL integration and live client contract tests
        run: |
          make test-api
          # The HTTP process uses the disposable application DB, not Pest's test database.
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            INSERT INTO regions (code,kind,name) VALUES ('ID','COUNTRY','Indonesia');
            INSERT INTO regions (code,kind,name,parent_id) SELECT '11','PROVINCE','Aceh',id FROM regions WHERE code='ID';
            INSERT INTO units(code,name) VALUES ('ci-unit','Unit');
            INSERT INTO categories(slug,name) VALUES ('ci-category','Category');
            INSERT INTO products(slug,name,status,published_at) VALUES ('ci-fixture','Fixture','PUBLISHED',now());
            INSERT INTO product_categories SELECT p.id,c.id FROM products p,categories c WHERE p.slug='ci-fixture' AND c.slug='ci-category';
            INSERT INTO product_variants(product_id,unit_id,sku,option_key,name,weight_g,rts_enabled,rts_price_amount)
              SELECT p.id,u.id,'CI-SKU','default','Fixture',100,true,25000 FROM products p,units u WHERE p.slug='ci-fixture' AND u.code='ci-unit';
          SQL
          CONTRACT_REGION_CODE=11 CONTRACT_PRODUCT_SLUG=ci-fixture make test-contract
      - name: Verify storefront forwards the Google redirect to the browser
        env:
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
        run: |
          docker compose up -d --wait storefront
          docker compose exec -T storefront node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const res = await fetch('http://127.0.0.1:3000/api/v1/auth/google/redirect', { redirect: 'manual' });
          assert.equal(res.status, 302);
          const location = new URL(res.headers.get('location'));
          assert.equal(location.origin, 'https://accounts.google.com');
          assert.equal(location.searchParams.get('code_challenge_method'), 'S256');
          assert.ok(res.headers.getSetCookie().length);
          JS
      - name: Remove test services and volumes
        if: always()
        run: docker compose down -v --remove-orphans

  production-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin, storefront]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --target prod -f infrastructure/docker/${{ matrix.app }}/Dockerfile -t snowego/${{ matrix.app }}:ci .
      - name: Scan image for critical vulnerabilities
        run: |
          docker save snowego/${{ matrix.app }}:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --input /image.tar --scanners vuln --severity CRITICAL --exit-code 1 --no-progress
